# Publishes a release with wp-swiper.zip for every "vX.Y.Z" tag; sites with
# the plugin then see the update (wp-swiper.php: wp_swiper_updates()). Only
# once the tests (tests.yml) have passed for that tag: otherwise no release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K\S+' wp-swiper.php)
          stable=$(grep -m1 -oP '^Stable tag:\s*\K\S+' readme.txt)
          if [ "$tag" != "$header" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag, wp-swiper.php Version $header and readme.txt Stable tag $stable must match."
            exit 1
          fi

      # For the minifiers below (npx, versions pinned).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # git archive leaves out what .gitattributes marks export-ignore (dev
      # files). The plugin's own scripts and stylesheets then minified in the
      # copy that goes into the zip, under the same names (the repository
      # keeps them as written, comments and all); Swiper's are minified already.
      - name: Build wp-swiper.zip
        run: |
          mkdir build
          git archive --format=tar --prefix=wp-swiper/ HEAD | tar -x -C build
          cd build/wp-swiper
          for f in assets/js/*.js; do
            npx --yes terser@5.31.6 "$f" --compress --mangle --comments false -o "$f.min"
            mv "$f.min" "$f"
          done
          for f in assets/css/*.css; do
            npx --yes lightningcss-cli@1.25.1 --minify "$f" -o "$f.min"
            mv "$f.min" "$f"
          done
          cd ..
          zip -qr ../wp-swiper.zip wp-swiper

      - uses: softprops/action-gh-release@v2
        with:
          files: wp-swiper.zip
          generate_release_notes: true
